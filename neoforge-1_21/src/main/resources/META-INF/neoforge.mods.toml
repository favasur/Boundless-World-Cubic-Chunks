modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"

[[mods]]
modId = "cubicchunks"
version = "${version}"
displayName = "CubicChunks"
description = "Infinite vertical world height for Minecraft."
authors = "BoundlessWorld-CubicChunks"

[[mixins]]
config = "cubicchunks.mixins.json"

[[mixins]]
config = "cubicchunks.client.mixins.json"

[[mixins]]
config = "cubicchunks.fixes.worldgen.mixins.json"

[[mixins]]
config = "cubicchunks.immersiveportals.mixins.json"

[[mixins]]
config = "cubicchunks.mixins.optifine.json"

# The :common module is embedded via JAR-in-JAR (META-INF/jarjar/metadata.json).
# JIJ is a classpath mechanism — the modlauncher extracts the jar and adds
# its classes to the classpath at launch. No toml dependency declaration is
# needed because cubicchunks_common is not a standalone mod with a
# META-INF/neoforge.mods.toml that FML can discover; declaring it as a
# dependency would cause FML to look for a mod file that doesn't exist.
