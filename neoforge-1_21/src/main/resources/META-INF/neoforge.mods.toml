modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"

[[mods]]
modId = "cubicchunks"
version = "${version}"
displayName = "CubicChunks"
description = "Infinite vertical world height for Minecraft."
authors = "OpenCubicChunks"

[[mixins]]
config = "cubicchunks.mixins.json"

[[mixins]]
config = "cubicchunks.client.mixins.json"

[[mixins]]
config = "cubicchunks.fixes.worldgen.mixins.json"

[[mixins]]
config = "cubicchunks.immersiveportals.mixins.json"

[[mixins]]
config = "cubicchunks.mixins.optifine.json"

# JAR-in-JAR dependency on the bundled :common module — its stand-alone modId
# is `cubicchunks_common` (see common/src/main/resources/fabric.mod.json). The
# NeoForge launcher reads this block and unwraps the JIJ child at
# `META-INF/jarjar/io.github.opencubicchunks.common-…jar` as that sub-mod, so
# common's classes resolve at runtime. Reference `cubicchunks_common` (the
# embedded modId), not `cubicchunks` (the parent), or the launcher will skip it.
[[dependencies.cubicchunks]]
    modId = "cubicchunks_common"
    type = "jarJar"
    targetPackage = "io.github.opencubicchunks.cubicchunks"
