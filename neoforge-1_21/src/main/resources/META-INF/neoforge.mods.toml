modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"

[[mods]]
modId = "cubicchunks"
version = "${version}"
displayName = "CubicChunks"
description = "Infinite vertical world height for Minecraft."
authors = "BoundlessWorld-CubicChunks"

[[mixins]]
config = "cubicchunks.mixins.json"

[[mixins]]
config = "cubicchunks.client.mixins.json"

[[mixins]]
config = "cubicchunks.fixes.worldgen.mixins.json"

[[mixins]]
config = "cubicchunks.immersiveportals.mixins.json"

[[mixins]]
config = "cubicchunks.mixins.optifine.json"

# Declare `cubicchunks_common` (the embedded :common modId) as a REQUIRED
# dependency. The actual JAR-in-JAR embedding is handled by
# META-INF/jarjar/metadata.json at the modlauncher level — the toml block
# only expresses the logical dependency, so `type` must be a valid
# DependencyType enum value (REQUIRED/OPTIONAL/WEAK/DISCOURAGED), NOT the
# legacy ForgeGradle "jarJar" literal that NeoForge's SPI rejects.
[[dependencies.cubicchunks]]
    modId = "cubicchunks_common"
