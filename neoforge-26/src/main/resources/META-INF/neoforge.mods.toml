modLoader = "javafml"
# loaderVersion 26 is not yet released; this constraint will fail-open at
# install time until a real NeoForge 26.x ships. Replace with the actual
# version range when it does.
loaderVersion = "[26,)"
license = "MIT"

[[mods]]
modId = "cubicchunks"
# `${file.jarVersion}` (the previous value) is not substituted by the moddev
# plugin — only `${version}` is, and only when `project.version` is set in
# build.gradle.kts. Field order matches neoforge-1_21's manifest.
version = "${version}"
displayName = "CubicChunks (NeoForge 26.x forward-compatible)"
authors = "BoundlessWorld-CubicChunks"
description = "Infinite vertical world height for Minecraft. NeoForge 26.x forward-compatible module."

# The 26.x coordinates in libs.versions.toml currently alias 1.21.x. When
# Minecraft 1.26.x and NeoForge 26.x actually ship, update both this range
# AND libs.versions.toml so the launcher's version check matches the actual
# release.
[[dependencies.cubicchunks]]
modId = "neoforge"
mandatory = true
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cubicchunks]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# The :common module is embedded via JAR-in-JAR (META-INF/jarjar/metadata.json).
# JIJ is a classpath mechanism — the modlauncher extracts the jar and adds
# its classes to the classpath at launch. No toml dependency declaration is
# needed because cubicchunks_common is not a standalone mod with a
# META-INF/neoforge.mods.toml that FML can discover; declaring it as a
# dependency would cause FML to look for a mod file that doesn't exist.

# Mirror neoforge-1_21's mixin config loadout so the transition to 26.x is
# a version bump, not a manifest rewrite. The configs themselves live in
# common-0.4.jar's META-INF resources when this module is built against the
# 1.21.x-bridge coordinates in libs.versions.toml.
[[mixins]]
config = "cubicchunks.mixins.json"

[[mixins]]
config = "cubicchunks.client.mixins.json"

[[mixins]]
config = "cubicchunks.fixes.worldgen.mixins.json"

[[mixins]]
config = "cubicchunks.immersiveportals.mixins.json"

[[mixins]]
config = "cubicchunks.mixins.optifine.json"
